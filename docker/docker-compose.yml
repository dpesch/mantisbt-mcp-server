services:
  mantisbt-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mantisbt-mcp-server:latest
    container_name: mantisbt-mcp-server
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    environment:
      - TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - PORT=${PORT:-3000}
      - MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}
      - MANTIS_BASE_URL=${MANTIS_BASE_URL}
      - MANTIS_API_KEY=${MANTIS_API_KEY:-}
      - MANTIS_USE_INDEX_PHP=${MANTIS_USE_INDEX_PHP:-}
      - MANTIS_CACHE_DIR=/home/node/.cache/mantisbt-mcp
      - MANTIS_CACHE_TTL=${MANTIS_CACHE_TTL:-3600}
      - MANTIS_SEARCH_ENABLED=${MANTIS_SEARCH_ENABLED:-false}
      - MANTIS_SEARCH_BACKEND=${MANTIS_SEARCH_BACKEND:-vectra}
      - MANTIS_SEARCH_THREADS=${MANTIS_SEARCH_THREADS:-1}
      - MANTIS_UPLOAD_DIR=${MANTIS_UPLOAD_DIR:-}
    volumes:
      - mantis_cache:/home/node/.cache/mantisbt-mcp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mantis_cache:
